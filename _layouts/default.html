<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset='utf-8'>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <link rel="stylesheet" type="text/css" media="screen"
    href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

  {% seo %}
  {% include head-custom.html %}
</head>

<body id="top">

  <!-- ================= HEADER / NAVIGATION ================= -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- <span class="hero__badge">Portfolio</span> -->
      <h1 class="brand" data-text="{{ site.title }}">{{ site.title }}</h1>
      <p class="subtitle">{{ site.description }}</p>

      <div class="header-social">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener"
          aria-label="GitHub">GitHub</a>
        <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener"
          aria-label="LinkedIn">LinkedIn</a>
        <a href="mailto:{{ site.email }}" aria-label="Email">Email</a>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT GRID ================= -->
  <main class="container layout-grid">
    <div class="main-content">
      {{ content | markdownify }}
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-copy">
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.author | default: site.title }}. All rights reserved.</p>
      </div>
      <p class="footer-pages">Published with <a href="https://pages.github.com">GitHub Pages</a></p>
    </div>
  </footer>

</body>

</html>
